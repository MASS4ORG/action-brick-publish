name: Turian brick publish readiness
description: Read-only check that a MASS4 asset store would accept a brick release before anything is signed or uploaded
author: MASS4
branding:
  icon: check-circle
  color: purple

# Public-only mode runs without credentials. Full readiness runs inside tag-time publication.
inputs:
  brick-path:
    description: Brick folder, relative to the workspace, whose package.json names the release; unused when package-id is set
    default: .
  package-id:
    description: Brick id; empty to read it from the manifest
    default: ""
  version:
    description: Release version; empty to read it from the manifest
    default: ""
  variants:
    description: Space-separated release variants whose store records are checked
    default: source
  image:
    description: Resolved CLI image digest; a tag@digest reference also checks tag identity
    required: true
  store-url:
    description: Asset store the release would be uploaded to
    default: https://bricks.mass4.org
  public-key:
    description: Optional OpenSSH public key; omitted identity checks are skipped in public-only mode
    default: ""
  store-token:
    description: Namespace token for full tag-time readiness; unused in public-only mode
    default: ""
  public-only:
    description: Run only unauthenticated checks and report the remaining checks as skipped
    default: "false"
  verified-version:
    description: Version label already verified by the shared image resolver
    default: ""

outputs:
  ready:
    description: true when every check passed
    value: ${{ steps.readiness.outputs.ready }}
  checked-at:
    description: UTC time of the check
    value: ${{ steps.readiness.outputs.checked-at }}

runs:
  using: composite
  steps:
    - name: Check publish readiness
      id: readiness
      shell: bash
      env:
        BRICK_PATH: ${{ inputs.brick-path }}
        PACKAGE_ID: ${{ inputs.package-id }}
        PACKAGE_VERSION: ${{ inputs.version }}
        VARIANTS: ${{ inputs.variants }}
        IMAGE: ${{ inputs.image }}
        STORE_URL: ${{ inputs.store-url }}
        PUBLIC_KEY: ${{ inputs.public-key }}
        STORE_TOKEN: ${{ inputs.store-token }}
        PUBLIC_PREFLIGHT: ${{ inputs.public-only }}
        READINESS_VERIFIED_VERSION: ${{ inputs.verified-version }}
      run: |
        set +x
        source "$GITHUB_ACTION_PATH/../scripts/store-token.sh"
        source "$GITHUB_ACTION_PATH/../scripts/readiness.sh"
        if [[ -z "$PACKAGE_ID" || -z "$PACKAGE_VERSION" ]]; then
          manifest="$GITHUB_WORKSPACE/$BRICK_PATH/package.json"
          [[ -n "$PACKAGE_ID" ]] || PACKAGE_ID=$(jq -r '.id // .name // ""' "$manifest" 2>/dev/null || true)
          [[ -n "$PACKAGE_VERSION" ]] || PACKAGE_VERSION=$(jq -r '.version // ""' "$manifest" 2>/dev/null || true)
        fi
        readiness_run
